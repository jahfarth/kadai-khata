name: ci
on: [push, workflow_dispatch]
jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node test.js
      - name: Check docs/ is in sync
        run: |
          node build-pages.js
          git diff --exit-code docs
      - name: Start with docker compose and check the main screen
        run: |
          docker compose up --build -d
          for i in $(seq 1 20); do curl -fsS http://localhost:3000/ && break; sleep 2; done
          curl -fsS http://localhost:3000/ | grep -q "Kadai Khata"
          curl -fsS -X POST http://localhost:3000/api/parse -d '{"transcript":"Ravi took rice, 200 rupees on credit"}' | grep -q '"amount":200'
          docker compose down
